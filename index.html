const R=(a,b)=>Math.random()*(b-a)+a;
const P=a=>a[Math.floor(Math.random()*a.length)];
const CL=(v,l,h)=>Math.min(h,Math.max(l,v));
const HS=e=>[[0,5],[1,3],[2,2],[3,1],[5,0]][CL(e,0,4)];

function getAdj(pois,thr){const adj={};pois.forEach(p=>{adj[p.id]=[]});for(let i=0;i<pois.length;i++)for(let j=i+1;j<pois.length;j++){const d=Math.sqrt((pois[i].x-pois[j].x)**2+(pois[i].y-pois[j].y)**2);if(d<thr){adj[pois[i].id].push(pois[j]);adj[pois[j].id].push(pois[i])}}pois.forEach(p=>{if(adj[p.id].length<2){const s=[...pois].filter(q=>q.id!==p.id).sort((a,b)=>Math.sqrt((a.x-p.x)**2+(a.y-p.y)**2)-Math.sqrt((b.x-p.x)**2+(b.y-p.y)**2));s.slice(0,3).forEach(n=>{if(!adj[p.id].find(x=>x.id===n.id))adj[p.id].push(n)})}});return adj}
function pickAdj(adj,cur,excl){const n=(adj[cur]||[]).filter(x=>x.id!==excl);return n.length?P(n):adj[cur]?.[0]||null}

const MAP_ADV={"s":["红蝶","邦邦","雕刻家","杰克","歌剧演员"],"m":["歌剧演员","跛脚羊","艾维","喧嚣","台球手"],"l":["红夫人","渔女","噩梦","女王蜂","记录员"]};

function simBP(gn,tA,tB,used,globalState){

  const gs=globalState||{bannedSurvs:new Set(),bannedHunters:new Set()};

  // === MAP PHASE ===
  const avail=MAP_NAMES.filter(m=>!used.includes(m));
  const isOdd=gn%2===1;
  // Odd games: away(tB) bans, home(tA) picks; Even: swap
  const banTeam=isOdd?tB:tA, pickTeam=isOdd?tA:tB;
  const ban1=P(avail),ban2=P(avail.filter(m=>m!==ban1));

  const map=mapScored[0]?.m||P(pool);

  steps.push({type:"mapPick",team:pickTeam.name,targets:[map],label:"选择地图"});

  // === PHASE 1: Hunter Ban 2 Survivors ===
  const availSForBan=()=>ALL_S.filter(s=>!gameBannedS.has(s));
  const hBan1=availSForBan().sort(()=>Math.random()-.5).slice(0,2);
  hBan1.forEach(s=>gameBannedS.add(s));
  steps.push({type:"survBan",team:`${tA.name}(监管)`,targets:hBan1,label:"一Ban·禁用2名求生者"});
  const hBan1b=availSForBan().sort(()=>Math.random()-.5).slice(0,2);
  hBan1b.forEach(s=>gameBannedS.add(s));
  steps.push({type:"survBan",team:`${tB.name}(监管)`,targets:hBan1b,label:"一Ban·禁用2名求生者"});

  // === PHASE 2: Survivor Ban Hunters (G1:0, G2:1, G3+:2) ===
  const huntBanCount=gn<=1?0:gn===2?1:2;
  if(huntBanCount>0){
    const availH=()=>ALL_H.filter(h=>!gameBannedH.has(h));
    const sBanH_A=availH().sort(()=>Math.random()-.5).slice(0,huntBanCount);
    sBanH_A.forEach(h=>gameBannedH.add(h));
    steps.push({type:"huntBan",team:`${tA.name}(求生)`,targets:sBanH_A,label:`禁用${huntBanCount}名监管者`});
    const sBanH_B=availH().sort(()=>Math.random()-.5).slice(0,huntBanCount);
    sBanH_B.forEach(h=>gameBannedH.add(h));
    steps.push({type:"huntBan",team:`${tB.name}(求生)`,targets:sBanH_B,label:`禁用${huntBanCount}名监管者`});
  }

  // Helper: pick character from player's pool, excluding banned
  const pickChar=(player,bannedSet)=>{
    const available=player.pool.filter(c=>!bannedSet.has(c));
    return available.length>0?P(available):P(player.pool); // fallback if all banned
  };

  // === PHASE 3: Survivor Pick 2 (global ban triggers) ===
  const pickSurvs=(team,count,isGlobal)=>{
    const players=team.players.filter(p=>p.side==="s");
    const picked=[];
    const remaining=[...players];
    for(let i=0;i<Math.min(count,remaining.length);i++){
      const p=remaining[i];
      const char=pickChar(p,gameBannedS);
      picked.push({...p,char});
      if(isGlobal&&globalPicksThisGame.length<3){
        globalPicksThisGame.push(char);
        gs.bannedSurvs.add(char); // globally banned for future games
      }
      gameBannedS.add(char); // can't be picked again this game
    }
    return picked;
  };

  const sA_12=pickSurvs(tA,2,gn<=3);
  steps.push({type:"survPick",team:tA.name,targets:sA_12.map(s=>`${s.nick}→${s.char}${gn<=3?"🔒":""}`),label:`一Pick·选择2名求生者${gn<=3?"（全局禁用）":""}`,color:tA.color});
  const sB_12=pickSurvs(tB,2,gn<=3);
  steps.push({type:"survPick",team:tB.name,targets:sB_12.map(s=>`${s.nick}→${s.char}${gn<=3?"🔒":""}`),label:`一Pick·选择2名求生者${gn<=3?"（全局禁用）":""}`,color:tB.color});

  // === PHASE 4: Hunter Ban 1 Survivor ===
  const hBan2_A=[P(availSForBan())];hBan2_A.forEach(s=>gameBannedS.add(s));
  steps.push({type:"survBan",team:`${tA.name}(监管)`,targets:hBan2_A,label:"二Ban·禁用1名求生者"});
  const hBan2_B=[P(availSForBan())];hBan2_B.forEach(s=>gameBannedS.add(s));
  steps.push({type:"survBan",team:`${tB.name}(监管)`,targets:hBan2_B,label:"二Ban·禁用1名求生者"});

  // === PHASE 5: Survivor Pick 3rd (global ban) ===
  const sA_3=pickSurvs(tA,1,gn<=3);// picks from remaining players (index 2)
  // Need to handle: sA_12 already picked players 0,1; sA_3 picks player 2
  const getRemaining=(team,alreadyPicked)=>{
    const all=team.players.filter(p=>p.side==="s");
    return all.filter(p=>!alreadyPicked.find(a=>a.id===p.id));
  };
  const remA=getRemaining(tA,sA_12);
  const sA_3_actual=remA.length>0?[{...remA[0],char:pickChar(remA[0],gameBannedS)}]:[];
  if(sA_3_actual.length&&gn<=3){gs.bannedSurvs.add(sA_3_actual[0].char);gameBannedS.add(sA_3_actual[0].char);}
  if(sA_3_actual.length)steps.push({type:"survPick",team:tA.name,targets:sA_3_actual.map(s=>`${s.nick}→${s.char}${gn<=3?"🔒":""}`),label:`二Pick·第3名${gn<=3?"（全局禁用）":""}`,color:tA.color});

  const remB=getRemaining(tB,sB_12);
  const sB_3_actual=remB.length>0?[{...remB[0],char:pickChar(remB[0],gameBannedS)}]:[];
  if(sB_3_actual.length&&gn<=3){gs.bannedSurvs.add(sB_3_actual[0].char);gameBannedS.add(sB_3_actual[0].char);}
  if(sB_3_actual.length)steps.push({type:"survPick",team:tB.name,targets:sB_3_actual.map(s=>`${s.nick}→${s.char}${gn<=3?"🔒":""}`),label:`二Pick·第3名${gn<=3?"（全局禁用）":""}`,color:tB.color});

  // === PHASE 6: Hunter Ban last 1 Survivor ===
  const hBan3_A=[P(availSForBan())];hBan3_A.forEach(s=>gameBannedS.add(s));
  steps.push({type:"survBan",team:`${tA.name}(监管)`,targets:hBan3_A,label:"三Ban·禁用最后1名"});
  const hBan3_B=[P(availSForBan())];hBan3_B.forEach(s=>gameBannedS.add(s));
  steps.push({type:"survBan",team:`${tB.name}(监管)`,targets:hBan3_B,label:"三Ban·禁用最后1名"});

  // === PHASE 7: Survivor Pick 4th (NOT globally banned) ===
  const remA2=getRemaining(tA,[...sA_12,...sA_3_actual]);
  const sA_4=remA2.length>0?[{...remA2[0],char:pickChar(remA2[0],gameBannedS)}]:[];
  if(sA_4.length)steps.push({type:"survPick",team:tA.name,targets:sA_4.map(s=>`${s.nick}→${s.char}`),label:"三Pick·第4名（不触发全局禁用）",color:tA.color});

  const remB2=getRemaining(tB,[...sB_12,...sB_3_actual]);
  const sB_4=remB2.length>0?[{...remB2[0],char:pickChar(remB2[0],gameBannedS)}]:[];
  if(sB_4.length)steps.push({type:"survPick",team:tB.name,targets:sB_4.map(s=>`${s.nick}→${s.char}`),label:"三Pick·第4名（不触发全局禁用）",color:tB.color});

  // === PHASE 8: Hunter Pick ===
  const pickSmartH=(t)=>{
    const f=t.players.find(p=>p.role.includes("先手"));
    const s=t.players.find(p=>p.role.includes("后手"));
    const fAvail=f.pool.filter(h=>!gameBannedH.has(h));
    const sAvail=s.pool.filter(h=>!gameBannedH.has(h));
    if(fAvail.length===0&&sAvail.length>0) return{player:s,char:P(sAvail)};
    if(sAvail.length===0&&fAvail.length>0) return{player:f,char:P(fAvail)};
    // Prefer map-appropriate
    const fMap=fAvail.filter(h=>(MAP_ADV[md.sz]||[]).includes(h));
    const sMap=sAvail.filter(h=>(MAP_ADV[md.sz]||[]).includes(h));
    if(sMap.length>fMap.length) return{player:s,char:P(sMap)||P(sAvail)};
    return{player:f,char:fMap.length>0?P(fMap):P(fAvail)};
  };
  const hAR=pickSmartH(tA),hBR=pickSmartH(tB);
  // Add to global ban for future games
  if(gn<=3){gs.bannedHunters.add(hAR.char);gs.bannedHunters.add(hBR.char);}
  steps.push({type:"huntPick",team:tA.name,targets:[`${hAR.player.nick}→${hAR.char}${gn<=3?"🔒":""}`],label:"选择监管者",color:tA.color});
  steps.push({type:"huntPick",team:tB.name,targets:[`${hBR.player.nick}→${hBR.char}${gn<=3?"🔒":""}`],label:"选择监管者",color:tB.color});

  const sA=[...sA_12,...sA_3_actual,...sA_4];
  const sB=[...sB_12,...sB_3_actual,...sB_4];
  const hA={...hAR.player,char:hAR.char};
  const hB={...hBR.player,char:hBR.char};

  const bpCmt={who:"公主",text:`本局${map}（${md.sz==="s"?"小图":md.sz==="l"?"大图":"中图"}），${tA.name}选${hAR.char}，${tB.name}选${hBR.char}。${gn>=2?"随着全局BP消耗，双方角色池在收窄。":"首局试探性选角。"}`};
  return{map,md,steps,sA,sB,hA,hB,bpCmt,globalState:gs};
}

function checkDrama(ctx,fired){
  // Drama pool - filter already fired

  // Funny pool - filter already fired
  const funnyHit=FUNNY_POOL.map(f=>f(ctx)).filter(Boolean).filter(f=>!fired.has(f.id));
  const all=[...candidates.map(d=>({...d.gen(ctx),id:d.id})),...funnyHit];
  // Personality (max 1 per half per player)
  const tgtId=Object.keys(PERSONA).find(k=>k.endsWith("_"+ctx.tgt));
  if(tgtId&&!fired.has("pers_"+tgtId)&&Math.random()<0.6){
    const pf=PERSONA[tgtId];
    if(pf){
      const roll=Math.random();
      if(roll<0.2&&pf.funny?.length) all.push({msg:P(pf.funny),type:"drama",crowd:"funny",id:"pers_"+tgtId});
      else if(roll<0.35&&pf.good?.length) all.push({msg:P(pf.good),type:"drama",crowd:"hype",id:"pers_"+tgtId});
      else if(roll<0.5&&pf.bad?.length) all.push({msg:P(pf.bad),type:"drama",crowd:"yygq",id:"pers_"+tgtId});
    }
  }
  const huntId=Object.keys(PERSONA).find(k=>k.endsWith("_"+ctx.hunter));
  if(huntId&&!fired.has("pers_"+huntId)&&Math.random()<0.5){
    const pf=PERSONA[huntId];
    if(pf){
      const roll=Math.random();
      if(roll<0.3&&pf.funny?.length) all.push({msg:P(pf.funny),type:"drama",crowd:"funny",id:"pers_"+huntId});
      else if(roll<0.5&&pf.bad?.length) all.push({msg:P(pf.bad),type:"drama",crowd:"yygq",id:"pers_"+huntId});
    }
  }
  if(all.length===0)return null;
  const ev=P(all);
  let crowd="";
  if(ev.crowd==="yygq"&&Math.random()<0.55){
    // Long-form copypasta barrage
    crowd="「"+CROWD.copypasta(ctx.tgt||"选手",ctx.hunter||"监管",ctx.hunter||"监管",ctx.tgt||"选手")+"」";
  }else if(ev.crowd){
    crowd="「"+P(CROWD[ev.crowd]||CROWD.hype)+"」";
  }
  if(ev.id) fired.add(ev.id); // mark as fired
  return{...ev,crowdReact:crowd};
}

// ─── HALF SIMULATION ────────────────────────────────────
function simHalf(survs,hunter,md,mapName,momBonus){
  const evts=[];let t=0,cip=0;

  let elim=0;const hP=hunter.st.m*.30+hunter.st.i*.25+hunter.st.p*.2+hunter.st.c*.15;
  // Bleeding mechanic: effective decoder count reduced when teammates are downed/chaired
  const effDec=()=>{
    const free=alive.filter(s=>s.state!=="dead"&&s.state!=="down");
    const downed=alive.filter(s=>s.state==="down").length;
    return Math.max(0, free.length - downed * 0.25); // each downed person reduces efficiency
  };
  // 压机 mechanic: hold 5th cipher for coordination timing
  const shouldHoldCipher=()=>cip>=4.3&&cip<5&&alive.some(s=>s.state==="down"||s.chCt>0);
  const cipProgress=(time)=>{
    const dec=effDec();
    let gain=(dec*time)/130;
    if(shouldHoldCipher()) gain*=0.15; // drastically slow down when holding
    return Math.min(5, cip+gain);
  };
  const tAvg=alive.reduce((s,p)=>(s+(p.st.m+p.st.i+p.st.p+p.st.c)/4),0)/alive.length;

    evts.push({...o,pos:{...pos},survStates:ss,hunterNick:hunter.nick});

  // Find first target
  const fT=Math.round(R(12,30));t+=fT;
  const tgt0=[...alive].sort((a,b)=>(a.role.includes("牵制")?-0.4:0.3)+R(-0.3,0.3))[0];
  pos[hunter.nick]=pickAdj(adj,tgt0.poi.id)||tgt0.poi;
  add({t,type:"find",msg:`${hunter.nick}（${hunter.char}·${hTalent}·${hSkill}）在${fT}秒发现${tgt0.nick}（${tgt0.char}·${tgt0.talent||""}），位于${tgt0.poi.id}`,poi:tgt0.poi,cmt:P(CMT.find(hunter.nick,tgt0.nick,fT)),targetNick:tgt0.nick});

  let chases=0;
  while(alive.filter(s=>s.state!=="dead").length>0&&chases<15&&t<480){

    const sP=tgt.st.m*.3+tgt.st.p*.25+tgt.st.i*.2;
    const roll=hP+mM+pM-sP-syn+stM+R(-stV,stV);
    let loc=tgt.poi;

    const drama=checkDrama(dCtx,fired);

      t+=Math.round(R(5,20));
      add({t,type:"drama",msg:drama.msg,hl:1,poi:loc,targetNick:tgt.nick,
        cmt:{who:"豆豆",text:drama.crowdReact||"这也太精彩了！"},crowd:drama.crowdReact});

    }

    // Terror shock
    if(Math.random()<0.06&&tgt.state==="ok"){

        `${hunter.nick}${hSk.a||"绕后"}震慑！${tgt.nick}翻窗瞬间被击倒！`,
      ]),poi:loc,hl:1,cmt:P(CMT.terror(hunter.nick,tgt.nick)),targetNick:tgt.nick,crowd:P(CROWD.shock)});
      cip=Math.min(5,cip+(alive.filter(s=>s.state!=="dead").length*10)/130);

  }else if(rem.length>0&&cip<5){
    // Time running out / ciphers not done - hunter hunts down remaining survivors
    add({t,type:"info",msg:`密码机进度不足（${Math.round(cip)}/5），局势对求生方极其不利`,cipher:Math.round(cip)});
    rem.forEach(s=>{
      t+=Math.round(R(10,30));
      const catchChance=0.75;
      if(Math.random()<catchChance){
        elim++;s.state="dead";
        add({t,type:"elim",msg:`${hunter.nick}在残局中追上${s.nick}将其淘汰！剩${4-elim}人`,poi:s.poi,hl:1,cipher:Math.round(cip)});
      }else{
        // Last-second cipher rush or hatch
        if(rem.indexOf(s)===rem.length-1&&elim===3){
          if(Math.random()<0.25){esc++;add({t,type:"escape",msg:`${s.nick}在绝境中摸到地窖逃脱！`,hl:1,crowd:P(CROWD.hype)});}
          else{elim++;s.state="dead";add({t,type:"elim",msg:`${s.nick}最终未能逃脱，被${hunter.nick}收割`,poi:s.poi});}
        }else{elim++;s.state="dead";add({t,type:"elim",msg:`${s.nick}在残局中被${hunter.nick}找到并淘汰`,poi:s.poi});}
      }
    });
  }
  esc=CL(esc,0,4);const[sS,hS]=HS(esc);
  let resCmt;if(esc===0)resCmt=P(CMT.four_k(hunter.nick));else if(esc===1)resCmt=P(CMT.three_k(hunter.nick));else if(esc===2)resCmt=P(CMT.draw());else resCmt=P(CMT.surv_win());
  add({t:t+20,type:"result",msg:`半局结束·逃脱${esc}人·求生${sS}:${hS}监管`,hl:1,isResult:1,cmt:resCmt,cipher:Math.min(5,Math.round(cip)),crowd:esc===0||esc>=3?P(CROWD.hype):null});
  return{evts,esc,sS,hS};
}

function simGame(gn,tA,tB,used,gs,mom){
  const bp=simBP(gn,tA,tB,used,gs);
  const momMod={A:CL((mom?.A||0)*0.03,-0.1,0.1),B:CL((mom?.B||0)*0.03,-0.1,0.1)};
  const up=simHalf(bp.sA,bp.hB,bp.md,bp.map,momMod.A);
  const lo=simHalf(bp.sB,bp.hA,bp.md,bp.map,momMod.B);
  const scA=up.sS+lo.hS,scB=up.hS+lo.sS;
  return{bp,up,lo,scA,scB,w:scA>scB?"A":scB>scA?"B":null,map:bp.map,gn};
}

      {tNick&&hNick&&pos[hNick]&&pos[tNick]&&<g>
        <line x1={pos[hNick].x} y1={pos[hNick].y} x2={pos[tNick].x} y2={pos[tNick].y} stroke="#ff4444" strokeWidth={3} opacity={.15} filter="url(#neon)"/>
        <line x1={pos[hNick].x} y1={pos[hNick].y} x2={pos[tNick].x} y2={pos[tNick].y} stroke="#ff4444" strokeWidth={1.5} opacity={.5} strokeDasharray="6 4">
          <animate attributeName="stroke-dashoffset" from="0" to="-20" dur=".8s" repeatCount="indefinite"/>
        </line>
      </g>}
      {(()=>{
        const entries=Object.entries(pos).filter(([,p])=>p!=null);

          const[nA,pA]=entries[i],[nB,pB]=entries[j];

          if(d<30){const a=Math.atan2(pA.y-pB.y,pA.x-pB.x)||(Math.PI/4*i),push=(30-d)/2+10;off[nA].dx+=Math.cos(a)*push;off[nA].dy+=Math.sin(a)*push;off[nB].dx-=Math.cos(a)*push;off[nB].dy-=Math.sin(a)*push;}

          return <g key={`av_${nick}`}><g transform={`translate(${ox},${oy})`} style={{transition:"transform 1s ease-in-out"}}>
            {isT&&<circle r={Rad+8} fill="none" stroke="#ff8844" strokeWidth={1.2} opacity={.5}><animate attributeName="r" from={Rad+3} to={Rad+14} dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" from=".6" to="0" dur="1s" repeatCount="indefinite"/></circle>}
            {arrow}<circle r={Rad+2} fill="none" stroke={bCol} strokeWidth={2.5} opacity={.9}/>
            {st==="down"&&<circle r={Rad} fill="#ff000033"><animate attributeName="opacity" from=".5" to=".1" dur=".6s" repeatCount="indefinite"/></circle>}
            <circle r={Rad} fill="#080c14" opacity={st==="down"?.7:.95}/>
            {st==="hurt"&&<line x1={-5} y1={-5} x2={5} y2={5} stroke="#ffaa00" strokeWidth={2} opacity={.6}/>}
            <text textAnchor="middle" dy={isH?5.5:4.5} fill={bCol} fontSize={isH?14:11} fontWeight={900} fontFamily="sans-serif">{nick[0].toUpperCase()}</text>
            <text y={Rad+9} textAnchor="middle" fill={bCol} fontSize={5.5} fontWeight={700} fontFamily="sans-serif" opacity={.9}>{nick}</text>
            {isH&&<circle r={Rad+2} fill="none" stroke="#ff000022" strokeWidth={5}/>}
          </g></g>;
        });
      })()}
      <text x={w/2} y={h+14} textAnchor="middle" fill="#141e28" fontSize={10} fontWeight={900} fontFamily="sans-serif" letterSpacing={3}>{mapName}</text>
    </svg>
  );
}

    const flat=[];

        const mA=momentum.A,mB=momentum.B;

        else if(mA<=-2)momMsg=`${tA.name}陷入困境…连败的阴影笼罩着队伍`;

      }

      g.bp.steps.forEach(step=>{const isBan=step.type.includes("Ban");flat.push({type:"bpStep",isBP:1,map:g.map,bpAction:isBan?"BAN":"PICK",bpLabel:step.label,bpTeam:step.team,bpTargets:step.targets,bpColor:step.color||(isBan?"#ff4444":"#44ff88"),msg:`${step.team} ${step.label}：${step.targets.join("、")}`});});
      flat.push({type:"bpDone",msg:`BP完成·地图：${g.map}`,hl:1,isH:1,map:g.map,bp:g.bp,cmt:g.bp.bpCmt,sub:`${tA.name}：${g.bp.hA.nick}(${g.bp.hA.char}) + ${g.bp.sA.map(s=>`${s.nick}(${s.char})`).join(" ")} | ${tB.name}：${g.bp.hB.nick}(${g.bp.hB.char}) + ${g.bp.sB.map(s=>`${s.nick}(${s.char})`).join(" ")}`});
      flat.push({type:"hh",msg:`▸ 上半场 ${tA.name}求生 vs ${tB.name}监管`,isH:1,map:g.map});
      g.up.evts.forEach(e=>flat.push({...e,map:g.map}));

      g.lo.evts.forEach(e=>flat.push({...e,map:g.map}));

            </div>;
          })()}
          {ei>=evs.length&&(aiCmt.princess||aiCmt.doudou)&&<div style={{marginTop:4,padding:"6px 8px",background:"#0c0c18",borderRadius:6,border:"1px solid #282840",fontSize:10,lineHeight:1.5}}><div style={{fontSize:8,color:"#555",marginBottom:3}}>赛后总结</div>{aiCmt.doudou&&<div><span style={{color:"#8df",fontWeight:700,fontSize:9}}>豆豆：</span><span style={{color:"#aaa"}}>{aiCmt.doudou}</span></div>}{aiCmt.princess&&<div><span style={{color:"#ffa",fontWeight:700,fontSize:9}}>公主：</span><span style={{color:"#aaa"}}>{aiCmt.princess}</span></div>}</div>}
        </div>
        <div ref={lr} style={{flex:1,overflowY:"auto",padding:"6px 12px"}}>
          {vis.map((ev,i)=><div key={i} className="ev-enter" style={{padding:ev.isH?"6px 0 2px":ev.isBP?"3px 0":"2px 0",borderBottom:ev.isResult?"1px solid #1a1a3a":"none",marginBottom:ev.isResult?5:0,animationDelay:`${Math.min(i*0.02,0.3)}s`}}>
            {ev.isH?<div className={ev.type==="end"?"hype-text":""} style={{fontSize:ev.type==="gh"||ev.type==="end"?14:ev.type==="gr"?13:ev.type==="bpDone"?11:10,fontWeight:800,color:ev.type==="end"?"#ffd700":ev.type==="gr"?"#eee":ev.type==="gh"?"#777":ev.type==="bpDone"?"#8af":"#555",paddingTop:ev.type==="gh"&&i>0?10:0,borderTop:ev.type==="gh"&&i>0?"1px solid #1a1a3a":"none"}}>{ev.msg}{ev.sub&&<div style={{fontSize:8,color:"#555",marginTop:2,fontWeight:400}}>{ev.sub}</div>}</div>
            :ev.isBP?<div style={{display:"flex",alignItems:"center",gap:6,padding:"3px 8px",margin:"2px 0",background:ev.bpAction==="BAN"?"#ff444409":"#44ff8809",borderLeft:`3px solid ${ev.bpAction==="BAN"?"#ff4444":"#44ff88"}`,borderRadius:"0 4px 4px 0"}}><span style={{fontSize:8,fontWeight:900,color:ev.bpAction==="BAN"?"#ff6666":"#66ffaa",minWidth:28}}>{ev.bpAction}</span><span style={{fontSize:10,color:"#888"}}>{ev.bpTeam}</span><span style={{fontSize:9,color:"#555"}}>·</span><span style={{fontSize:10,color:"#bbb",fontWeight:600}}>{ev.bpTargets.join("、")}</span><span style={{fontSize:8,color:"#444",marginLeft:"auto"}}>{ev.bpLabel}</span></div>
            :<div style={{display:"flex",gap:5,alignItems:"flex-start"}}>
              <span style={{fontSize:8,color:"#282840",minWidth:28,textAlign:"right",paddingTop:1,fontVariantNumeric:"tabular-nums"}}>{ev.t!=null?`${Math.floor(ev.t/60)}:${String(Math.round(ev.t)%60).padStart(2,"0")}`:""}</span>
              <span style={{width:5,height:5,borderRadius:"50%",marginTop:3,flexShrink:0,background:EC[ev.type]||"#222"}}/>
              <div style={{flex:1}}>
                <span className={ev.type==="drama"?"drama-flash":""} style={{fontSize:11,color:ev.type==="drama"?"#ff88ff":ev.hl?"#eee":"#888",fontWeight:ev.hl?600:400,textShadow:ev.type==="drama"?"0 0 8px #ff66ff44":ev.hl?"0 0 4px #ffffff22":"none"}}>{ev.msg}</span>
                {ev.cipher!=null&&<span style={{fontSize:8,color:"#2a3a4a",marginLeft:5}}>⚙{ev.cipher}/5</span>}
                {ev.crowd&&<div style={{fontSize:8,color:"#556",fontStyle:"italic",marginTop:1}}>{ev.crowd}</div>}
              </div>
            </div>}
          </div>)}
          {ei>=evs.length&&<div style={{textAlign:"center",padding:12,display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={()=>{setPh("roster");setGs([]);setEvs([]);setEi(0);}} style={{background:"transparent",border:"1px solid #1a1a2a",color:"#555",padding:"7px 18px",borderRadius:6,fontSize:10,cursor:"pointer"}}>返回·重新模拟</button>
            <button className="btn-glow" onClick={()=>{const ce=simCoachBattle();setEvs(e=>[...e,...ce]);}} style={{background:"linear-gradient(135deg,#ff6ec733,#ffd70033)",border:"1px solid #ff6ec755",color:"#ff6ec7",padding:"7px 18px",borderRadius:6,fontSize:10,cursor:"pointer",fontWeight:700}}>🔥 评委表演赛</button>
          </div>}
        </div>
      </div>
      {ei<evs.length&&<div style={{padding:"8px 14px",background:"linear-gradient(90deg,#0d1025,#151530,#0d1025)",borderTop:"1px solid #1a1a3a",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
        <button onClick={()=>setEi(i=>Math.min(i+1,evs.length))} className="btn-glow" style={{background:"linear-gradient(135deg,#1a1a3a,#252550)",border:"1px solid #3a3a5a",color:"#ccc",padding:"7px 18px",borderRadius:6,fontSize:11,cursor:"pointer",fontWeight:700}}>▶ 下一步</button>
        <button onClick={()=>setAu(!au)} className="btn-glow" style={{background:au?"linear-gradient(135deg,#00e5ff22,#00e5ff11)":"linear-gradient(135deg,#1a1a3a,#252550)",border:`1px solid ${au?"#00e5ff55":"#3a3a5a"}`,color:au?"#00e5ff":"#666",padding:"7px 14px",borderRadius:6,fontSize:11,cursor:"pointer"}}>{au?"⏸ 暂停":"⏵ 自动"}</button>
        <div style={{display:"flex",gap:2}}>{[1,2,4].map(s=><button key={s} onClick={()=>setSp(s)} style={{background:sp===s?"#252550":"transparent",border:"1px solid #3a3a5a",color:sp===s?"#fff":"#444",padding:"3px 7px",borderRadius:3,fontSize:9,cursor:"pointer"}}>{s}x</button>)}</div>
        <button onClick={()=>setEi(evs.length)} style={{background:"transparent",border:"1px solid #252550",color:"#444",padding:"7px 12px",borderRadius:6,fontSize:10,cursor:"pointer",marginLeft:"auto"}}>跳过⏭</button>
        <span style={{fontSize:8,color:"#1a1a2a"}}>{ei}/{evs.length}</span>
      </div>}
    </div>
  );
}
try{ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));}catch(e){document.getElementById("root").innerHTML="<pre style=color:#f66;padding:20px>"+e.message+"</pre>";}
</script></body></html>
